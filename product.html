<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết sản phẩm — EcoShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="logo">🌿 <span>Eco</span>Shop</div>
    <nav class="header-nav">
      <a href="index.html">Cửa hàng</a>
      <a href="admin.html" id="nav-admin-link" hidden>Quản trị</a>
      <div id="nav-auth-links" class="nav-auth-links">
        <a href="auth.html" class="nav-login-link">Đăng nhập</a>
        <a href="auth.html?tab=register" class="nav-register-link">Đăng ký</a>
      </div>
      <button class="cart-icon-btn" id="cart-icon-btn" aria-label="Giỏ hàng">
        🛒
        <span class="cart-badge" id="cart-badge" style="display:none">0</span>
      </button>
    </nav>
  </header>

  <!-- BREADCRUMB -->
  <div class="breadcrumb">
    <a href="index.html">🏠 Cửa hàng</a>
    <span>›</span>
    <span id="breadcrumb-name">Chi tiết sản phẩm</span>
  </div>

  <!-- PRODUCT DETAIL -->
  <main class="product-detail-page">
    <div id="product-loading" class="product-detail-skeleton">
      <div class="sk sk-detail-img"></div>
      <div class="sk-detail-body">
        <div class="sk sk-line" style="height:32px;width:70%;margin-bottom:16px"></div>
        <div class="sk sk-line" style="width:40%;margin-bottom:12px"></div>
        <div class="sk sk-line" style="width:90%;margin-bottom:8px"></div>
        <div class="sk sk-line" style="width:85%;margin-bottom:8px"></div>
        <div class="sk sk-line short" style="margin-bottom:32px"></div>
        <div class="sk sk-line" style="height:48px;width:50%;border-radius:24px"></div>
      </div>
    </div>

    <div id="product-content" class="product-detail-wrap" style="display:none">
      <div class="product-detail-img-wrap">
        <img id="detail-img" src="" alt="" onerror="this.src='https://picsum.photos/seed/eco/640/480';this.onerror=null">
        <div id="detail-badge-wrap" class="detail-badge-wrap"></div>
      </div>
      <div class="product-detail-info">
        <h1 id="detail-name" class="detail-name"></h1>
        <div class="detail-meta">
          <span id="detail-origin" class="detail-origin"></span>
          <span id="detail-cert" class="detail-cert"></span>
        </div>
        <p id="detail-desc" class="detail-desc"></p>
        <div class="detail-price-row">
          <span id="detail-price" class="detail-price"></span>
        </div>
        <div class="detail-qty-row">
          <label>Số lượng</label>
          <div class="detail-qty-ctrl">
            <button id="qty-minus" class="qty-btn">−</button>
            <span id="qty-value">1</span>
            <button id="qty-plus" class="qty-btn">+</button>
          </div>
        </div>
        <div class="detail-actions">
          <button id="btn-add-cart-detail" class="btn-add-cart-detail">🛒 Thêm vào giỏ hàng</button>
          <button id="btn-buy-now" class="btn-buy-now">⚡ Mua ngay</button>
        </div>
        <div class="detail-info-tags">
          <span>🌿 Thân thiện môi trường</span>
          <span>📦 Giao hàng toàn quốc</span>
          <span>✅ Chứng nhận chất lượng</span>
        </div>
      </div>
    </div>

    <div id="product-error" style="display:none" class="error-msg">
      Không tìm thấy sản phẩm. <a href="index.html" style="color:var(--green-600)">← Quay lại cửa hàng</a>
    </div>
  </main>

  <!-- GIỎ HÀNG MODAL -->
  <div id="cart-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="cart-title">
    <div class="modal-box cart-modal-box">
      <div class="modal-header">
        <h3 id="cart-title">🛒 Giỏ hàng của bạn</h3>
        <button id="cart-close" class="modal-close" aria-label="Đóng">✕</button>
      </div>
      <div id="cart-body" class="cart-body"></div>
      <div id="cart-footer" class="cart-footer" style="display:none">
        <div class="cart-total-row">
          <span>Tổng cộng:</span>
          <strong id="cart-total" class="cart-total-amount">0 ₫</strong>
        </div>
        <div class="cart-actions">
          <button id="cart-clear" class="btn-secondary">🗑️ Xóa tất cả</button>
          <button class="btn-primary" onclick="window.location.href='auth.html'">✅ Đặt hàng</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>© 2025 <strong>EcoShop</strong> — Vì một Việt Nam xanh hơn 🌱</p>
  </footer>

  <script type="module" src="js/product.js"></script>
</body>
</html>
