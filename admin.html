<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - EcoShop Management</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <style> body { font-family: 'DM Sans', sans-serif; } </style>
</head>
<body class="h-full bg-stone-100 flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-stone-900 text-white flex flex-col shrink-0">
        <div class="p-6 flex items-center gap-3 border-b border-stone-800">
            <i data-lucide="layout-dashboard" class="w-6 h-6 text-green-400"></i>
            <span class="font-bold text-xl uppercase tracking-wider">Eco Admin</span>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="flex items-center gap-3 bg-green-600 text-white px-4 py-3 rounded-lg shadow-lg">
                <i data-lucide="package" class="w-5 h-5"></i> Quản lý Sản phẩm
            </a>
            <a href="index.html" class="flex items-center gap-3 text-stone-400 hover:bg-stone-800 px-4 py-3 rounded-lg transition">
                <i data-lucide="eye" class="w-5 h-5"></i> Xem Trang chủ
            </a>
        </nav>
    </aside>

    <!-- Main -->
    <main class="flex-1 p-8 overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-stone-800">Danh sách sản phẩm</h1>
                <p class="text-stone-500">Quản lý kho hàng và chứng nhận hữu cơ</p>
            </div>
            <button class="bg-green-600 hover:bg-green-700 text-white px-6 py-2.5 rounded-xl font-bold flex items-center gap-2 shadow-md transition-all active:scale-95">
                <i data-lucide="plus-circle" class="w-5 h-5"></i> Thêm mới
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
            <table class="w-full text-left">
                <thead>
                    <tr class="bg-stone-50 border-b border-stone-200 text-stone-500 text-xs uppercase tracking-widest font-bold">
                        <th class="p-5">Thông tin sản phẩm</th>
                        <th class="p-5">Chứng nhận</th>
                        <th class="p-5">Giá bán</th>
                        <th class="p-5 text-right">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="admin-product-list" class="divide-y divide-stone-100">
                    <!-- JS sẽ render dữ liệu vào đây -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
