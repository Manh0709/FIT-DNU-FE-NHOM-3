<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - EcoShop Management</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <style> body { font-family: 'DM Sans', sans-serif; } </style>
</head>
<body class="h-full bg-stone-100 flex relative">

    <!-- Sidebar -->
    <aside class="w-64 bg-stone-900 text-white flex flex-col shrink-0">
        <div class="p-6 flex items-center gap-3 border-b border-stone-800">
            <i data-lucide="layout-dashboard" class="w-6 h-6 text-green-400"></i>
            <span class="font-bold text-xl uppercase tracking-wider">Eco Admin</span>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="flex items-center gap-3 bg-green-600 text-white px-4 py-3 rounded-lg shadow-lg shadow-green-900/20">
                <i data-lucide="package" class="w-5 h-5"></i> Quản lý Sản phẩm
            </a>
            <a href="index.html" class="flex items-center gap-3 text-stone-400 hover:bg-stone-800 hover:text-white px-4 py-3 rounded-lg transition">
                <i data-lucide="eye" class="w-5 h-5"></i> Xem Trang chủ
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8 overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-stone-800">Danh sách sản phẩm</h1>
                <p class="text-stone-500">Quản lý kho hàng và chứng nhận hữu cơ</p>
            </div>
            <button onclick="openModal()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all transform active:scale-95 shadow-md">
                <i data-lucide="plus-circle" class="w-5 h-5"></i> Thêm mới
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
            <table class="w-full text-left">
                <thead>
                    <tr class="bg-stone-50 border-b border-stone-200 text-stone-500 text-xs uppercase tracking-widest font-bold">
                        <th class="p-5">Thông tin sản phẩm</th>
                        <th class="p-5">Chứng nhận</th>
                        <th class="p-5">Giá bán</th>
                        <th class="p-5 text-right">Thao tác</th>
                    </tr>
                </thead>
                <!-- Dữ liệu sẽ được render vào đây qua JS -->
                <tbody id="admin-product-list" class="divide-y divide-stone-100">
                    <!-- Dòng dữ liệu mẫu sẽ bị JS ghi đè -->
                    <tr><td colspan="4" class="p-5 text-center text-gray-500">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal Form (Ẩn mặc định) -->
    <div id="productModal" class="hidden fixed inset-0 bg-black/50 z-50 flex justify-center items-center">
        <div class="bg-white p-6 rounded-xl w-full max-w-lg">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Thêm/Sửa Sản Phẩm</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-500"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <!-- Form nội dung tạm thời -->
            <form id="productForm" class="space-y-4">
                <p class="text-sm text-gray-500">Các trường input form điền ở đây...</p>
                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 rounded-lg">Hủy</button>
                    <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-lg">Lưu lại</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script> <!-- Đảm bảo đã có các hàm getProducts() ở file này -->
    <script src="js/admin.js"></script> <!-- Script xử lý render dữ liệu bên dưới -->
    <script>
        // Kích hoạt các icon Lucide
        lucide.createIcons();
        
        // Modal functions cơ bản
        function openModal() { document.getElementById('productModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('productModal').classList.add('hidden'); }
    </script>
</body>
</html>
