<!doctype html>
<html lang="vi" class="h-full scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Leaf Organic - EcoShop</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
</head>
<body class="h-full font-body bg-stone-50 leaf-pattern flex flex-col min-h-screen">
  
  <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-green-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-full bg-green-600 flex items-center justify-center float-anim">
          <i data-lucide="leaf" class="w-5 h-5 text-white"></i>
        </div>
        <span class="font-heading text-xl font-bold text-green-900">EcoShop</span>
      </div>
      <div class="hidden md:flex items-center gap-8 text-sm font-medium text-stone-600">
        <a href="#" class="text-green-700 font-semibold transition">Cửa hàng</a>
        <a href="#order-section" class="hover:text-green-700 transition">Đặt hàng</a>
        <a href="admin.html" class="px-4 py-2 bg-stone-800 text-white rounded-lg hover:bg-stone-900 transition">Vào Admin</a>
      </div>
    </div>
  </nav>

  <main class="flex-grow max-w-7xl mx-auto px-6 py-8 w-full">
    
    <div class="mb-8 flex flex-wrap items-center gap-4 fade-in">
      <h3 class="font-semibold text-stone-700">Lọc theo chứng nhận:</h3>
      <select class="bg-white border border-green-200 text-stone-700 rounded-lg focus:ring-green-500 focus:border-green-500 block p-2.5 outline-none shadow-sm">
        <option value="all">Tất cả chứng nhận</option>
        <option value="usda">USDA Organic</option>
        <option value="eu">EU Organic</option>
        <option value="vnmac">VietGAP</option>
      </select>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6" id="product-list">
      <div class="bg-white rounded-2xl shadow-sm border border-green-50 overflow-hidden card-hover fade-in relative flex flex-col">
        <div class="absolute top-3 right-3 bg-green-100 text-green-800 text-xs font-bold px-2.5 py-1 rounded-full flex items-center gap-1 shadow-sm border border-green-200 z-10">
          <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> USDA Organic
        </div>
        
        <div class="h-48 bg-stone-200 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1518843875459-f738682238a6?auto=format&fit=crop&q=80&w=400" alt="Rau" class="w-full h-full object-cover">
        </div>
        
        <div class="p-5 flex flex-col flex-grow">
          <h3 class="font-heading font-bold text-lg text-stone-800 mb-1">Cải xoăn Kale Hữu Cơ</h3>
          <p class="text-sm text-stone-500 mb-3 flex items-center gap-1">
            <i data-lucide="map-pin" class="w-4 h-4"></i> Nông trại Đà Lạt
          </p>
          <div class="mt-auto flex items-center justify-between">
            <span class="text-green-700 font-bold text-lg">45.000đ</span>
            <button class="bg-green-600 hover:bg-green-700 text-white p-2 rounded-lg transition-colors" title="Thêm vào giỏ">
              <i data-lucide="shopping-cart" class="w-5 h-5"></i>
            </button>
          </div>
        </div>
      </div>
      </div>

    <div id="order-section" class="mt-16 bg-white p-8 rounded-2xl shadow-sm border border-green-100 max-w-2xl mx-auto fade-in">
      <h2 class="font-heading text-2xl font-bold text-stone-800 mb-6 flex items-center gap-2">
        <i data-lucide="clipboard-list" class="text-green-600"></i> Form Đặt Hàng
      </h2>
      <form class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Họ và tên</label>
          <input type="text" class="w-full border border-stone-200 rounded-lg p-2.5 focus:border-green-500 focus:ring-1 focus:ring-green-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Sản phẩm muốn đặt</label>
          <textarea rows="3" class="w-full border border-stone-200 rounded-lg p-2.5 focus:border-green-500 focus:ring-1 focus:ring-green-500 outline-none" placeholder="Ví dụ: 2kg Cải Kale, 1kg Cà chua..."></textarea>
        </div>
        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition-colors">
          Gửi Đơn Hàng
        </button>
      </form>
    </div>

  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
